<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morph Racer - Moto & Carro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 400px;
      border: 4px solid #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0, 255, 200, 0.3);
    }
    canvas {
      display: block;
      background: #000;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
    }
    #controls-info {
      margin-top: 15px;
      text-align: center;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div id="mode-text">MODO: MOTO (PLATAFORMA)</div>
      <div id="score-text">Distância: 0m</div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
  </div>

  <div id="controls-info">
    <p><strong>Controles Moto:</strong> BARRA DE ESPAÇO ou SETA PARA CIMA = Pular</p>
    <p><strong>Controles Carro:</strong> SETAS ESQUERDA / DIREITA = Mudar de Faixa</p>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const modeText = document.getElementById('mode-text');
    const scoreText = document.getElementById('score-text');

    // Configurações do Jogo
    let gameMode = 'MOTO'; // 'MOTO' ou 'CARRO'
    let distance = 0;
    const TRANSITION_DISTANCE = 300; // Distância para trocar de modo
    let gameOver = false;

    // Teclas
    const keys = {};

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        if (gameMode === 'MOTO' && !moto.isJumping) {
          moto.vy = moto.jumpForce;
          moto.isJumping = true;
        }
      }
      keys[e.code] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Moto (Modo Plataforma Lateral)
    const moto = {
      x: 100,
      y: 280,
      width: 50,
      height: 30,
      vy: 0,
      gravity: 0.8,
      jumpForce: -13,
      groundY: 280,
      isJumping: false,
      draw() {
        // Corpo da Moto
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Rodas
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(this.x + 10, this.y + this.height, 10, 0, Math.PI * 2);
        ctx.arc(this.x + this.width - 10, this.y + this.height, 10, 0, Math.PI * 2);
        ctx.fill();

        // Capacete do Piloto
        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(this.x + 20, this.y - 5, 8, 0, Math.PI * 2);
        ctx.fill();
      },
      update() {
        this.vy += this.gravity;
        this.y += this.vy;

        if (this.y >= this.groundY) {
          this.y = this.groundY;
          this.vy = 0;
          this.isJumping = false;
        }
      }
    };

    // Carro (Modo Visão Superior)
    const car = {
      x: 375,
      y: 300,
      width: 50,
      height: 80,
      speed: 6,
      lanes: [175, 375, 575],
      currentLane: 1,
      draw() {
        ctx.fillStyle = '#00ff88';
        ctx.fillRect(this.x, this.y, this.width, this.height);
        
        // Detalhes do Carro
        ctx.fillStyle = '#111';
        ctx.fillRect(this.x + 5, this.y + 15, this.width - 10, 20);
      },
      update() {
        const targetX = this.lanes[this.currentLane];
        this.x += (targetX - this.x) * 0.2;
      }
    };

    // Obstáculos
    let obstacles = [];
    let spawnTimer = 0;

    function spawnObstacle() {
      if (gameMode === 'MOTO') {
        obstacles.push({
          x: canvas.width,
          y: 290,
          width: 30,
          height: 20,
          type: 'barrier'
        });
      } else if (gameMode === 'CARRO') {
        const lane = Math.floor(Math.random() * 3);
        obstacles.push({
          x: car.lanes[lane] + 10,
          y: -80,
          width: 30,
          height: 60,
          type: 'traffic'
        });
      }
    }

    // Troca de Modo
    function switchMode(newMode) {
      gameMode = newMode;
      obstacles = [];
      
      if (newMode === 'CARRO') {
        modeText.innerText = "MODO: CARRO (CORRIDA)";
      }
    }

    // Loop Principal
    function gameLoop() {
      if (gameOver) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      distance += 0.5;
      scoreText.innerText = `Distância: ${Math.floor(distance)}m`;

      // Verificação de transição de fase
      if (gameMode === 'MOTO' && distance >= TRANSITION_DISTANCE) {
        switchMode('CARRO');
      }

      // --- RENDERIZAÇÃO E LÓGICA POR MODO ---
      if (gameMode === 'MOTO') {
        // Fundo e Chão Plataforma
        ctx.fillStyle = '#1a1a2e';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#4e4e6a';
        ctx.fillRect(0, 310, canvas.width, 90);
        
        ctx.fillStyle = '#00ffcc';
        ctx.fillRect(0, 308, canvas.width, 2);

        // Moto
        moto.update();
        moto.draw();

        // Obstáculos da Moto
        spawnTimer++;
        if (spawnTimer > 90) {
          spawnObstacle();
          spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.x -= 6;

          ctx.fillStyle = '#ff4444';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

          // Colisão Moto x Obstáculo
          if (
            moto.x < obs.x + obs.width &&
            moto.x + moto.width > obs.x &&
            moto.y < obs.y + obs.height &&
            moto.y + moto.height > obs.y
          ) {
            resetGame();
          }

          if (obs.x + obs.width < 0) obstacles.splice(i, 1);
        }

      } else if (gameMode === 'CARRO') {
        // Pista Superior
        ctx.fillStyle = '#222';
        ctx.fillRect(100, 0, 600, canvas.height);

        // Linhas de faixa
        ctx.strokeStyle = '#fff';
        ctx.setLineDash([20, 20]);
        ctx.lineWidth = 4;
        
        ctx.beginPath();
        ctx.moveTo(300, 0); ctx.lineTo(300, canvas.height);
        ctx.moveTo(500, 0); ctx.lineTo(500, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // Carro
        car.update();
        car.draw();

        // Obstáculos do Carro
        spawnTimer++;
        if (spawnTimer > 60) {
          spawnObstacle();
          spawnTimer = 0;
        }

        for (let i = obstacles.length - 1; i >= 0; i--) {
          let obs = obstacles[i];
          obs.y += 5;

          ctx.fillStyle = '#ffbb00';
          ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

          // Colisão Carro x Obstáculo
          if (
            car.x < obs.x + obs.width &&
            car.x + car.width > obs.x &&
            car.y < obs.y + obs.height &&
            car.y + car.height > obs.y
          ) {
            resetGame();
          }

          if (obs.y > canvas.height) obstacles.splice(i, 1);
        }
      }

      requestAnimationFrame(gameLoop);
    }

    // Entrada de comandos para troca de faixa do carro
    window.addEventListener('keydown', (e) => {
      if (gameMode === 'CARRO') {
        if (e.code === 'ArrowLeft' && car.currentLane > 0) {
          car.currentLane--;
        } else if (e.code === 'ArrowRight' && car.currentLane < 2) {
          car.currentLane++;
        }
      }
    });

    function resetGame() {
      distance = 0;
      obstacles = [];
      gameMode = 'MOTO';
      modeText.innerText = "MODO: MOTO (PLATAFORMA)";
      moto.y = moto.groundY;
      moto.vy = 0;
      car.currentLane = 1;
      car.x = car.lanes[1];
    }

    // Iniciar Jogo
    gameLoop();
  </script>
</body>
</html>
